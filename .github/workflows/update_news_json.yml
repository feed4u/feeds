name: Update News Feed

permissions:
  contents: write

on:
  schedule:
    - cron: "23 */8 * * *"  # Every 8 hours — each data push triggers a build on
                            # every git-integrated Pages project; this cadence
                            # keeps 5 projects under the 500 builds/month quota.
  workflow_dispatch:
    inputs:
      vertical:
        description: 'Vertical to update'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - k5
          - 4u
          - economics
          - storage
          - finnish

concurrency:
  group: news-data
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve vertical list
        id: verticals
        run: |
          # economics is disabled from the schedule; run it via workflow_dispatch
          CHOICE="${{ github.event.inputs.vertical || 'all' }}"
          if [ "$CHOICE" = "all" ]; then
            echo "list=k5 4u storage finnish" >> "$GITHUB_OUTPUT"
          else
            echo "list=$CHOICE" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r core/code/base/requirements.txt

      - name: Run pipeline
        run: |
          chmod +x core/code/run_pipeline.sh core/code/sync_web_data.sh
          for V in ${{ steps.verticals.outputs.list }}; do
            echo "::group::Pipeline for $V"
            VERTICAL=$V ./core/code/run_pipeline.sh
            echo "::endgroup::"
          done

      # Pushing the data commit is what deploys: each Cloudflare Pages project
      # is git-integrated and rebuilds its vertical from this repo on push.
      - name: Commit and push data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # core/source too: merge_feeds regenerates feeds.xml during the pipeline
          git add core/data/ core/source/

          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update news data (${{ steps.verticals.outputs.list }})"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi
