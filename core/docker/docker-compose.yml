version: "3.8"

services:
  data:
    build:
      context: ..
      dockerfile: docker/Dockerfile.data
    container_name: k5-data
    volumes:
      - ../data:/app/data
      - ../source:/app/source:ro
    environment:
      DAYS_BACK: "${DAYS_BACK:-30}"
      MAX_WORKERS: "${MAX_WORKERS:-10}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-25}"
    command: >
      /bin/sh -c "
        python /app/code/base/build_category_metadata.py --base-dir /app --vertical k5 &&
        python /app/code/base/fetch_news.py --base-dir /app --vertical k5 &&
        python /app/code/base/archive_news.py --base-dir /app --vertical k5 &&
        python /app/code/k5/create_trends.py --base-dir /app --vertical k5
      "

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
    volumes:
      - ../data:/usr/share/nginx/html/data:ro
    depends_on:
      - data
